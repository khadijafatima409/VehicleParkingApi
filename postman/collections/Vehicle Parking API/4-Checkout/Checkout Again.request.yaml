$kind: http-request
url: "{{baseUrl}}/api/tickets/{{checkoutTicketId}}/checkout"
method: POST
body:
  type: json
  content: '{ "method": "Cash", "amountGiven": 100 }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Returns 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Already closed\", () => {\r

      \    pm.expect(pm.response.json().message).to.eql(\"Ticket is already closed\");\r

      });"
    language: text/javascript
order: 5000
