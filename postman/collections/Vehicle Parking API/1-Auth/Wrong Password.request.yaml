$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: '{ "username": "admin", "password": "wrong" }'
scripts:
  - type: afterResponse
    code: pm.test("Wrong password returns 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
