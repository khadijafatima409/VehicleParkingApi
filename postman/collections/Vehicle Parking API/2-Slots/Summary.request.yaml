$kind: http-request
url: "{{baseUrl}}/api/parkingslots/summary"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Returns 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Free slots are not more than total\", () => {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.availableSlots).to.be.at.most(data.totalSlots);\r

      });"
    language: text/javascript
order: 3000
