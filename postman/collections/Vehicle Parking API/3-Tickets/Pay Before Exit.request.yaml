$kind: http-request
url: "{{baseUrl}}/api/tickets/{{ticketId}}/payment"
method: POST
body:
  type: json
  content: '{ "method": "Cash" }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Returns 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Must exit first\", () => {\r

      \    pm.expect(pm.response.json().message).to.eql(\"Ticket must be closed with a fee before payment\");\r

      });"
    language: text/javascript
order: 3000
